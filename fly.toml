# Fly.io config. Create the app and volume first:
#   fly launch --no-deploy --copy-config
#   fly volumes create khabsa_data --size 2 --region <region>
#   fly secrets set SESSION_SECRET=... DATABASE_URL=... PUBLIC_URL=https://<app>.fly.dev ADMIN_EMAILS=...
# Keep exactly ONE machine: room state lives in process memory.
app = "khabsa"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  TRUST_PROXY = "true"
  STORAGE_DIR = "/data/storage"

[[mounts]]
  source = "khabsa_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "GET"
  path = "/api/health"
