# Render.com blueprint ("Deploy to Render" button) — FREE setup.
# - one free web service (sleeps after 15 min with no visitors; wakes in ~1 min)
# - database: paste a free Neon Postgres connection string into DATABASE_URL
#   (Render's own free Postgres expires after 30 days, Neon's free plan does not)
# - files (avatars, game pictures) are stored in Postgres, so no disk is needed
# Voice works out of the box (peer to peer, with a fallback through this server).
# Optional: CLOUDFLARE_TURN_KEY_ID + CLOUDFLARE_TURN_KEY_API_TOKEN (free TURN relay, better
# quality on strict mobile networks), or LIVEKIT_* for big rooms.
# To upgrade later: change plan to "starter" (no sleeping).
services:
  - type: web
    name: khabsa
    runtime: docker
    region: frankfurt   # closest Render region to Jordan / the Levant
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # free instances have 512 MB RAM: cap the JS heap and keep few DB connections
      - key: NODE_OPTIONS
        value: --max-old-space-size=320
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: TMDB_TOKEN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_KEY_API_TOKEN
        sync: false
