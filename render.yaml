# Render.com blueprint: "Deploy to Render" creates everything below from this repo.
# - one web service (single instance: rooms live in process memory)
# - a persistent disk for uploads and private game images
# - a managed PostgreSQL database, wired in automatically
# Voice is optional: add LIVEKIT_URL / LIVEKIT_API_KEY / LIVEKIT_API_SECRET later.
services:
  - type: web
    name: khabsa
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: khabsa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: STORAGE_DIR
        value: /data/storage
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: khabsa-db
          property: connectionString
      - key: ADMIN_EMAILS
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

databases:
  - name: khabsa-db
    plan: basic-256mb
    databaseName: khabsa
    user: khabsa
