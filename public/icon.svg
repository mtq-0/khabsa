<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="خبصة">
  <defs>
    <linearGradient id="kbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b4dff"/>
      <stop offset="0.55" stop-color="#5b21c9"/>
      <stop offset="1" stop-color="#00a9d6"/>
    </linearGradient>
    <radialGradient id="kgl" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kst" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3d8ff"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#kbg)"/>
  <rect width="100" height="100" rx="24" fill="url(#kgl)"/>
  <!-- splash droplets: the "mess" in خبصة -->
  <circle cx="20" cy="74" r="5" fill="#ff3d9a"/>
  <circle cx="13" cy="62" r="2.6" fill="#ff3d9a" opacity="0.85"/>
  <circle cx="84" cy="30" r="4" fill="#3ce7ff"/>
  <circle cx="88" cy="42" r="2.2" fill="#3ce7ff" opacity="0.85"/>
  <circle cx="80" cy="80" r="3" fill="#ffd84d"/>
  <!-- stylised Arabic letter خ -->
  <path d="M30 42 H64 Q72 42 66 49 L44 65 Q36 72 43 80 Q51 88 70 83" fill="none" stroke="url(#kst)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="48" cy="26" r="7" fill="#ffd84d"/>
</svg>
